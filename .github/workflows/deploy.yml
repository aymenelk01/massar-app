name: Deploy
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'    

permissions:
  contents: read
  id-token: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      static: ${{ steps.filter.outputs.static }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            static:
              - 'app/static/**'
            app:
              - 'app/backend/**'
            migrations:
              - 'app/flyway/**'  

  deploy-migrations:
    needs: check-changes
    if: needs.check-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-south-1
      ECS_CLUSTER: dev-cluster
      ECS_TASK_FAMILY: dev-flyway-task
      ENVIRONMENT: dev
      CONTAINER_NAME: flyway-migration
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-migrations

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/flyway-repository-dev" >> $GITHUB_ENV  

      - name: Build the Docker image
        run: docker build -t $IMAGE_URI:sha-${{ github.sha }} -t $IMAGE_URI:latest ./app/flyway

      - name: Push the Docker image
        run: |
              docker push $IMAGE_URI:sha-${{ github.sha }} 
              docker push $IMAGE_URI:latest

      - name: Run Flyway migrations
        run: |
          # 1. Discover Security Group ID matching the exact Terraform Name tag
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=ECS-SG-${{ env.ENVIRONMENT }}" \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          
          # 2. Discover all Subnet IDs using wildcard to capture multi-AZ blocks (1, 2, 3)
          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=PrivateAppSubnet-${{ env.ENVIRONMENT }}-*" \
            --query "join(',', Subnets[*].SubnetId)" \
            --output text)
          
          echo "Discovered Security Group ID: $SG_ID"
          echo "Discovered Private Subnet IDs: $SUBNET_IDS"
          
          # Strict validation to prevent running task with empty variables
          if [ -z "$SG_ID" ] || [ -z "$SUBNET_IDS" ] || [ "$SG_ID" = "None" ] || [ "$SUBNET_IDS" = "None" ]; then
            echo "Critical Error: Unable to discover network resources. Verify AWS infrastructure state and tags."
            exit 1
          fi
          
          # 3. Execute the ECS task on Fargate with discovered resources
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SG_ID],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          
          echo "Launched Task ARN: $TASK_ARN"
          
          # 4. Wait for the task to finish execution
          aws ecs wait tasks-stopped --cluster "${{ env.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          
          # 5. Fetch execution results and parse exit code
          TASK_DETAILS=$(aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }}" --tasks "$TASK_ARN")
          
          EXIT_CODE=$(echo "$TASK_DETAILS" | jq -r '.tasks[0].containers[] | select(.name=="${{ env.CONTAINER_NAME }}").exitCode')
          STOPPED_REASON=$(echo "$TASK_DETAILS" | jq -r '.tasks[0].stoppedReason')
          
          echo "Flyway Container Exit Code: $EXIT_CODE"
          echo "ECS Task Stopped Reason: $STOPPED_REASON"
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Deployment failed. Review the ECS CloudWatch Logs for Task ARN: $TASK_ARN"
            exit 1
          fi

  deploy-app:
    needs: [check-changes, deploy-migrations]
    if: needs.check-changes.outputs.app == 'true' && (needs.deploy-migrations.result == 'success' || needs.deploy-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-south-1
      ECS_CLUSTER: dev-cluster
      ECS_SERVICE: dev-service
      ECS_TASK_FAMILY: dev-task
      CONTAINER_NAME: massar-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-app

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        run: echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/ecr-repository-dev" >> $GITHUB_ENV  

      - name: Build the Docker image
        run: docker build -t $IMAGE_URI:sha-${{ github.sha }} -t $IMAGE_URI:latest ./app/backend

      - name: Push the Docker image
        run: |
              docker push $IMAGE_URI:sha-${{ github.sha }} 
              docker push $IMAGE_URI:latest
          
      - name: Download active task definition
        run: |
              aws ecs describe-task-definition \
                --task-definition ${{ env.ECS_TASK_FAMILY }} \
                --query taskDefinition > task-definition.json
          
      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
              task-definition: task-definition.json
              container-name: ${{ env.CONTAINER_NAME }}
              image: ${{ env.IMAGE_URI }}:sha-${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-static:
    needs: check-changes
    if: needs.check-changes.outputs.static == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-south-1
      S3_BUCKET_NAME: dev-app-massar-static
      ENVIRONMENT: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-static

      - name: export the cognito environment variables from ssm 
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name '/massar/${{ env.ENVIRONMENT }}/cognito_user_pool_id' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter --name '/massar/${{ env.ENVIRONMENT }}/cognito_client_id' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV    

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
         node-version: '24'
         cache: 'npm' # Cache npm dependencies to speed up subsequent builds

      - name: Install dependencies and build static files
        working-directory: ./app/static
        run: |
          npm ci
          npm run build

      - name: Upload static files to S3
        run: |
          # 1. Upload all hashed assets by vite (JS, CSS) with 1-year cache
          aws s3 sync ./app/static/dist s3://$S3_BUCKET_NAME/static --delete \
            --exclude "*.html" \
            --cache-control "max-age=31536000, public, immutable" 

          # 2. Upload HTML files with no-cache to ensure they are always fresh
          aws s3 sync ./app/static/dist s3://$S3_BUCKET_NAME/static \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" 
            