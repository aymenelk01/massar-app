# Flyway base configuration

# Location of migration scripts inside the container
flyway.locations=filesystem:/flyway/sql

# Automatically baseline an existing database on first run.
# Required when migrating a database that already has schema objects
# but no flyway_schema_history table yet.
flyway.baselineOnMigrate=true
flyway.baselineVersion=0

# Fail fast on missing migrations to prevent accidental gaps in versioning
flyway.validateOnMigrate=true

# Disallow mixing transactional and non-transactional statements in the same
# migration script. Keeping them separate ensures predictable rollback behaviour.
flyway.mixed=false

# Connection Security Configuration using native Driver parameters
flyway.jdbcProperties.sslMode=trust
# flyway.jdbcProperties.serverSslCert=/flyway/rds-ca.pem
