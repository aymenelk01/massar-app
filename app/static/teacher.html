<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Massar Portal — Teacher Dashboard" />
  <title>Teacher Dashboard — Massar Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Top government banner -->
    <header class="gov-banner">
      <div class="gov-banner__inner">
        <span class="gov-banner__text-left">Kingdom of Morocco</span>
        <div class="gov-banner__emblem" aria-hidden="true">
          <img src="logo.svg" alt="Emblem" />
        </div>
        <span class="gov-banner__text-right">Royaume du Maroc</span>
      </div>
    </header>

    <!-- App Navbar -->
    <nav class="navbar">
      <div class="navbar__inner">
        <div class="navbar__brand">
          <img src="logo.svg" alt="Massar Logo" class="navbar__logo" />
          <span class="navbar__title">Massar <span style="font-weight: 300; font-size: 0.95rem; margin-left: 8px; color: var(--neutral-600);">Teacher Portal</span></span>
        </div>
        <button class="btn btn--ghost btn--sm" id="logout-btn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="margin-right: 6px; vertical-align: middle;">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log Out
        </button>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content" style="align-items: flex-start;">
      <div class="container" style="max-width: 900px;">
        
        <div class="teacher-header">
          <div>
            <h1 class="student-card__name" style="margin-bottom: 2px;">Teacher Space</h1>
            <p class="student-card__code">Select a student below to update their grades and academic status.</p>
          </div>
        </div>

        <!-- Alert messages -->
        <div class="alert alert--success" id="success-alert" role="alert" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <span id="success-alert-text"></span>
        </div>

        <div class="alert alert--error" id="error-alert" role="alert" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span id="error-alert-text"></span>
        </div>

        <!-- Loading skeleton -->
        <div id="loading-state" class="loading-card" aria-live="polite" aria-label="Loading student list">
          <div class="skeleton skeleton--title"></div>
          <div class="skeleton skeleton--line"></div>
          <div class="skeleton skeleton--line skeleton--short"></div>
          <div class="skeleton skeleton--table"></div>
        </div>

        <!-- Student List Table Card -->
        <div id="students-card" class="student-card" style="padding: 30px;" hidden>
          <div class="table-wrapper" style="margin-bottom: 0;">
            <table class="results-table" id="students-table">
              <thead>
                <tr>
                  <th scope="col">Massar Code</th>
                  <th scope="col">Student Full Name</th>
                  <th scope="col">Email</th>
                  <th scope="col">Phone</th>
                  <th scope="col" style="text-align: center;">Status</th>
                  <th scope="col" style="text-align: center;">Actions</th>
                </tr>
              </thead>
              <tbody id="students-tbody">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <!-- Modal backdrop for editing grades (hidden by default) -->
    <div id="edit-modal-backdrop" class="modal-backdrop" style="display: none;">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">Edit Grades</h3>
          <button class="modal-close" id="modal-close-btn" type="button" aria-label="Close modal">&times;</button>
        </div>
        
        <div id="modal-error-alert" class="alert alert--error" role="alert" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span id="modal-error-text"></span>
        </div>

        <form id="edit-grade-form" class="form">
          <div class="form-group">
            <label class="form-label" style="font-weight: bold; color: var(--neutral-600);">Student:</label>
            <span id="modal-student-name" style="font-size: 1.1rem; font-weight: bold; color: var(--neutral-800);">—</span>
            <span id="modal-student-code" style="font-size: 0.85rem; color: var(--neutral-600);">—</span>
          </div>

          <div class="divider" style="margin: 12px 0;"></div>

          <!-- Subject Input List -->
          <div class="form-group">
            <label class="form-label" for="grade-math">Mathématiques <span class="required">*</span></label>
            <input class="form-input grade-input" type="number" id="grade-math" step="0.25" min="0" max="20" required placeholder="0.00 to 20.00" />
          </div>

          <div class="form-group">
            <label class="form-label" for="grade-phys">Physique-Chimie <span class="required">*</span></label>
            <input class="form-input grade-input" type="number" id="grade-phys" step="0.25" min="0" max="20" required placeholder="0.00 to 20.00" />
          </div>

          <div class="form-group">
            <label class="form-label" for="grade-svt">Sciences de la Vie et de la Terre <span class="required">*</span></label>
            <input class="form-input grade-input" type="number" id="grade-svt" step="0.25" min="0" max="20" required placeholder="0.00 to 20.00" />
          </div>

          <div class="form-group">
            <label class="form-label" for="grade-philo">Philosophie <span class="required">*</span></label>
            <input class="form-input grade-input" type="number" id="grade-philo" step="0.25" min="0" max="20" required placeholder="0.00 to 20.00" />
          </div>

          <div class="modal-footer">
            <button class="btn btn--ghost" id="modal-cancel-btn" type="button">Cancel</button>
            <button class="btn btn--primary" id="modal-save-btn" type="submit">
              <span id="save-btn-label">Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="gov-footer">
      <span>© 2026 Ministry of National Education, Preschool and Sports — Kingdom of Morocco</span>
    </footer>
  </div>

  <script src="teacher.js"></script>
</body>
</html>
